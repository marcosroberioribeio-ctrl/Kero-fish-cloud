name: Kero Fish Quality Gate

on:
  push:
    branches: [main, v12.1.0-profissional, v12.1.0-integracao-analista]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app.py kero_fish tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
